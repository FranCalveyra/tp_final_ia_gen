[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-tp-admision"
version = "1.1.0"
description = "Kit del TP final de IA Generativa: la ficha de admisión de guardia"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[tool.setuptools]
packages = ["admision"]

# Se ejecuta desde el checkout: uv no construye ni instala el kit local.
[tool.uv]
package = false

[dependency-groups]
inferencia = [
    "torch==2.15.0; sys_platform == 'linux'",
    "transformers==5.22.1; sys_platform == 'linux'",
    "accelerate==1.15.0; sys_platform == 'linux'",
]
modal = ["modal==1.6.3"]
tracking = ["wandb==0.31.0"]
